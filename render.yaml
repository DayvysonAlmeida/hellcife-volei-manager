services:
  - type: web
    name: hellcife-volei-api
    plan: free
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false  # Configurar manualmente com a URL do Neon
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Configurar com o domínio da Vercel
      - key: PYTHON_VERSION
        value: "3.12.4"
